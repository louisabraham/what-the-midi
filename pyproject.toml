[project]
name = "what-the-midi"
version = "0.1.0"
description = "Search a melody in a large MIDI collection with suffix arrays"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "mido>=1.3.3",
    "numpy>=1.24",
    "pydivsufsort>=0.0.20",
    "symusic>=0.5",
    "tqdm>=4.60",
]

[project.scripts]
what-the-midi = "whatthemidi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whatthemidi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
